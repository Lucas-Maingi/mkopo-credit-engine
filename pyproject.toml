[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkopo"
version = "0.1.0"
description = "Mkopo Score - behavioural credit scoring for mobile-money economies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lucas Maingi" }]
keywords = ["credit-scoring", "credit-risk", "scorecard", "mobile-money", "mlops"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "optuna>=3.6",
    "mlflow>=2.12",
    "shap>=0.45",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "skl2onnx>=1.16",
    "onnxmltools>=1.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "joblib>=1.4",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.33", "plotly>=5.20"]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
mkopo = "mkopo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ARG", "PTH"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests that train models (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/mkopo"]
omit = ["*/dashboard/*"]
